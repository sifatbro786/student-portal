# /etc/nginx/conf.d/tm-english.conf — Ubuntu 24.04 (conf.d files are included inside `http {}`)
# PRD §16 / SEC-06 / SEC-07. Next.js listens on 127.0.0.1:3000 (PM2 "web").
# IPv4 only: the VPS has no IPv6 address (add `listen [::]:…` lines if one is added later).
# Paths assume: app = /var/www/tm/app, uploads = /var/www/tm/data/uploads (UPLOAD_ROOT).
# Only on RHEL/AlmaLinux (SELinux): setsebool -P httpd_can_network_connect 1 && restorecon -Rv /var/www/tm
# Nginx (www-data) needs read access to .next/standalone/.next/static and uploads/public (mode 755).

# ---------------------------------------------------------------- rate limits (per client IP)
# Generous on purpose: Bangladeshi mobile/broadband ISPs put many users behind ONE public IP
# (CGNAT), and Next.js prefetches links (every page prefetches /login). Only POSTs to the
# login / admission endpoints are tightly limited; the app adds per-email limits on top.
map $request_method $tm_post_ip {
    POST    $binary_remote_addr;
    default "";                 # empty key = not counted
}
limit_req_zone $tm_post_ip         zone=tm_login:10m rate=30r/m;     # sign-in attempts
limit_req_zone $tm_post_ip         zone=tm_admission:10m rate=10r/m; # admission submissions
limit_req_zone $binary_remote_addr zone=tm_general:10m rate=50r/s;   # anti-flood only (pages prefetch many links)
limit_req_status 429;

upstream tm_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ---------------------------------------------------------------- http → https, www → apex
server {
    listen 80;
    server_name tm-english.org www.tm-english.org;

    # Let's Encrypt renewals (certbot --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://tm-english.org$request_uri; }
}

server {
    listen 443 ssl http2; # Ubuntu 24.04 ships nginx 1.24 (no `http2 on;` yet)
    server_name www.tm-english.org;
    ssl_certificate     /etc/letsencrypt/live/tm-english.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tm-english.org/privkey.pem;
    return 301 https://tm-english.org$request_uri;
}

# ---------------------------------------------------------------- the site
server {
    listen 443 ssl http2; # Ubuntu 24.04 ships nginx 1.24 (no `http2 on;` yet)
    server_name tm-english.org;

    ssl_certificate     /etc/letsencrypt/live/tm-english.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tm-english.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tm_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    # Next.js sends CSP & the other security headers; HSTS belongs here (HTTPS only).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Default body limit: forms, Server Actions (4 MB), admission photo (3 MB)
    client_max_body_size 5m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/manifest+json;

    # Common proxy settings. X-Real-IP is what the app's rate limiter trusts (server/rate-limit.js).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 120s;

    # ---- public uploads (honor, gallery, testimonials, hero) — random immutable names
    location /media/ {
        alias /var/www/tm/data/uploads/public/;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # ---- Next build output (hashed names) straight from disk
    location /_next/static/ {
        alias /var/www/tm/app/.next/standalone/.next/static/;
        # pdf.js worker is an .mjs module: browsers refuse it as application/octet-stream
        include mime.types;
        types { application/javascript mjs; }
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- student submissions: 5 files × 20 MB, streamed to Node (never buffered here)
    location /api/submissions/ {
        client_max_body_size 110m;
        proxy_request_buffering off;
        proxy_read_timeout 660s; # the app caps uploads at 10 minutes
        proxy_send_timeout 660s;
        limit_req zone=tm_general burst=10 nodelay;
        proxy_pass http://tm_next;
    }

    # ---- admin gallery upload: up to 12 photos, 64 MB per request
    location = /api/admin/gallery {
        client_max_body_size 64m;
        proxy_read_timeout 300s;
        proxy_pass http://tm_next;
    }

    # ---- other admin uploads (materials ≤ 25 MB, assignments, honor, hero) + streamed ZIP / CSV
    location /api/admin/ {
        client_max_body_size 30m;
        proxy_buffering off;   # ZIP download and CSV export stream
        proxy_read_timeout 600s;
        proxy_pass http://tm_next;
    }

    # ---- public admission form (honeypot + token + app limits; this is the outer wall)
    location = /api/admissions {
        client_max_body_size 5m;
        limit_req zone=tm_admission burst=5 nodelay;
        proxy_pass http://tm_next;
    }

    location = /login {
        limit_req zone=tm_login burst=20 nodelay;
        proxy_pass http://tm_next;
    }

    # never serve dotfiles (.env, .git) even if something goes wrong upstream
    location ~ /\.(?!well-known) { deny all; }

    location / {
        limit_req zone=tm_general burst=200 nodelay;
        proxy_pass http://tm_next;
    }
}
