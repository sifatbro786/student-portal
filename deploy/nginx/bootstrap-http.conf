# Temporary Nginx config for the FIRST certificate only (P9 Step 2).
# The real config (tm-english.conf) points at certificate files that don't exist yet,
# so Nginx would refuse to start with it. Flow:
#   1. this file → /etc/nginx/conf.d/tm-english.conf, reload
#   2. certbot certonly --webroot -w /var/www/certbot -d tm-english.org -d www.tm-english.org
#   3. replace it with tm-english.conf, reload
server {
    listen 80 default_server;
    server_name tm-english.org www.tm-english.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        default_type text/plain;
        return 200 "tm-english.org: server ready (the site is deployed in Step 3)\n";
    }
}
